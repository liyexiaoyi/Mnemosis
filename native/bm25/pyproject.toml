[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mnemosis-bm25-native"
version = "0.1.0"
requires-python = ">=3.10"
description = "Optional Rust BM25 kernel; Python memory policies remain in Mnemosis"
license = "MIT"

[tool.maturin]
module-name = "_mnemosis_rust"
features = ["pyo3/extension-module"]
