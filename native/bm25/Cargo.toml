[package]
name = "mnemosis-bm25-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Optional resident BM25 scoring kernel for Mnemosis"

[lib]
name = "_mnemosis_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["extension-module"] }

[profile.release]
lto = "thin"
codegen-units = 1
