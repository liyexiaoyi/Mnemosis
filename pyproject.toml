[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosis"
version = "0.3.0"
description = "A human-inspired memory layer for AI agents: dual-track episodic/semantic memory, forgetting curves, sleep consolidation, active forgetting and metacognition."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mnemosis contributors" }]
keywords = ["ai", "memory", "agents", "llm", "cognitive", "forgetting-curve", "consolidation", "metacognition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/liyexiaoyi/Mnemosis"
Documentation = "https://github.com/liyexiaoyi/Mnemosis#readme"
Repository = "https://github.com/liyexiaoyi/Mnemosis"
Issues = "https://github.com/liyexiaoyi/Mnemosis/issues"

[project.scripts]
mnemosis = "mnemosis.cli:main"
mnemosis-mcp = "mnemosis.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
# Benchmarks are one-off dev scripts; SIM115 (file context managers)
# would churn 284 call sites with no runtime benefit. src/ and tests/
# keep the full rule set.
"benchmarks/*" = ["SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
