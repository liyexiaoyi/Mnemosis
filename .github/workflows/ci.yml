name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      perf_baseline_reset:
        description: "Reset the get_many performance baseline"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -q
        env:
          PYTHONPATH: src
      - name: Capability regression gate
        run: python benchmarks/ci_regression.py
        env:
          PYTHONPATH: src

  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LoCoMo 88-question smoke
        run: |
          python benchmarks/locomo_bench.py --no-baselines --mode keyword \
            --out /tmp/locomo_smoke.json
        env:
          PYTHONPATH: src
      - name: Lifecycle smoke
        run: python benchmarks/lifecycle_eval.py
        env:
          PYTHONPATH: src
      - name: CLI end-to-end acceptance
        run: python benchmarks/e2e_cli_workflow.py
        env:
          PYTHONPATH: src
      - name: Chinese reasoning smoke (16 questions, retrieval only)
        run: python benchmarks/reasoning_zh_bench.py --out /tmp/reasoning_smoke.json
        env:
          PYTHONPATH: src
      - name: Conflict resolution smoke (8 scenarios, retrieval only)
        run: python benchmarks/conflict_evidence_bench.py --out /tmp/conflict_smoke.json
        env:
          PYTHONPATH: src
      - name: Process/CoT steps smoke (6 scenarios, retrieval only)
        run: >
          python benchmarks/process_zh_bench.py --project mnemosis_steps
          --retrieval-only --out /tmp/process_smoke.json
        env:
          PYTHONPATH: src
      - name: Conflict resolution 10k smoke (8 scenarios, retrieval only)
        run: >
          python benchmarks/conflict_evidence_10k_bench.py
          --out /tmp/conflict_10k_smoke.json
        env:
          PYTHONPATH: src
      - name: Chinese synonym 10k smoke (3 scenarios, retrieval only)
        run: >
          python benchmarks/synonym_zh_10k_bench.py
          --out /tmp/synonym_10k_smoke.json
        env:
          PYTHONPATH: src
      - name: Outcome evidence 10k smoke (3 questions, retrieval only)
        run: >
          python benchmarks/outcome_evidence_10k_bench.py
          --out /tmp/outcome_10k_smoke.json
        env:
          PYTHONPATH: src
      - name: Plan choice smoke (1 goal, retrieval only)
        run: >
          python benchmarks/plan_choice_bench.py
          --out /tmp/plan_choice_smoke.json
        env:
          PYTHONPATH: src
      - name: Plan capacity 10k smoke (5-step plan, retrieval only)
        run: >
          python benchmarks/plan_capacity_bench.py
          --out /tmp/plan_capacity_smoke.json
        env:
          PYTHONPATH: src
      - name: Plan effort smoke (low/medium/high mapping, retrieval only)
        run: >
          python benchmarks/plan_effort_bench.py
          --out /tmp/plan_effort_smoke.json
        env:
          PYTHONPATH: src
      - name: Restore get_many trend cache
        # Trend history is cached across runs so slow ("frog in boiling
        # water") regressions show up as median drift, not only ceiling hits.
        # The key must change every run (run_id) or the cache save is
        # skipped and the trend never updates.
        uses: actions/cache@v4
        with:
          path: benchmarks/results/get_many_trend.json
          key: get-many-trend-v1-${{ github.run_id }}
          restore-keys: |
            get-many-trend-v1-
      - name: get_many performance gate (run)
        run: python benchmarks/ci_perf.py
        env:
          PYTHONPATH: src
          MNEMOSIS_PERF_RESET: ${{ github.event.inputs.perf_baseline_reset || '' }}
          MNEMOSIS_PERF_SUMMARY_PATH: /tmp/get_many_perf.md
      - name: Upload get_many stats artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: get-many-stats-${{ github.run_id }}
          path: benchmarks/results/get_many_stats.json
          if-no-files-found: warn
      - name: Post get_many perf summary to PR
        # always(): even a failed gate should post the (possibly fallback)
        # summary so reviewers see the failure reason on the PR.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let body;
            try {
              body = fs.readFileSync(
                process.env.MNEMOSIS_PERF_SUMMARY_PATH,
                "utf8"
              );
            } catch (error) {
              body =
                "⚠️ get_many performance gate script crashed before " +
                "generating a summary.";
            }
            const marker = "<!-- mnemosis-perf-gate -->";
            const tagged = body + "\n" + marker;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              }
            );
            const existing = comments.find((c) =>
              c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: tagged,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: tagged,
              });
          }

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install typecheck dependencies
        run: python -m pip install -e ".[dev,typecheck]"
      - name: Type check
        run: python -m mypy src/mnemosis

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and smoke-install the package
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m pip install dist/*.whl
          mnemosis --help >/dev/null
          mnemosis-mcp --help >/dev/null
          python -c "from mnemosis import MemoryEngine; e=MemoryEngine(); e.remember('hello'); print(e.recall('hello')[0].item.content)"
      - name: Re-plan 10k smoke (failed-step avoidance, retrieval only)
        run: >
          python benchmarks/replan_10k_bench.py
          --out /tmp/replan_10k_smoke.json
        env:
          PYTHONPATH: src
      - name: Sleep replay 10k smoke (post-replay stability, retrieval only)
        run: >
          python benchmarks/sleep_replay_10k_bench.py
          --out /tmp/sleep_replay_10k_smoke.json
        env:
          PYTHONPATH: src
