name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -q
        env:
          PYTHONPATH: src

  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LoCoMo 88-question smoke
        run: |
          python benchmarks/locomo_bench.py --no-baselines --mode keyword \
            --out /tmp/locomo_smoke.json
        env:
          PYTHONPATH: src
      - name: Lifecycle smoke
        run: python benchmarks/lifecycle_eval.py
        env:
          PYTHONPATH: src
      - name: CLI end-to-end acceptance
        run: python benchmarks/e2e_cli_workflow.py
        env:
          PYTHONPATH: src
